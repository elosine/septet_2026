<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 9h-1 THE STAND, FIRST SLICE (PLAN §9, day 46): one part, full screen, on the
     iPad. The three lines that make Share → Add to Home Screen open this page as
     a full-screen app with no Safari toolbar (9d's home-screen piece): -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="stand.manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scattered Substance">
<link rel="apple-touch-icon" href="stand-icon.png">
<title>Scattered Substance</title>
<style>
  :root { color-scheme: light; }
  /* the decided notation text font (V0.7) — served from /notation/app/fonts */
  @font-face { font-family: 'Crimson Pro Light'; font-style: normal; font-weight: 300; src: url('fonts/CrimsonPro-Light.ttf') format('truetype'); }
  @font-face { font-family: 'Crimson Pro Light'; font-style: italic; font-weight: 300; src: url('fonts/CrimsonPro-LightItalic.ttf') format('truetype'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  /* the frame IS the screen: no chrome, no scroll, no selection, no pinch
     (AR-22); the safe-area insets keep the page off a notch or home bar */
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* the sheet is laid out by CSS — below the status bar, to the screen's other
     three edges — and the frame is MEASURED from it (getBoundingClientRect),
     never computed from innerHeight or the insets: on the home-screen app two
     computed versions each left the last row short (iPad, day 46). The home
     indicator at the bottom overlays the music; a black strip there read as a bug. */
  #sheet { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--strip, 0px)); left: 0; right: 0; bottom: 0;
           background: #fff; overflow: hidden; }
  /* 9i: THE LEADER'S STRIP (AR-30) — a thin band above the leader's own part, nothing
     covered: the sheet starts below it and is measured from its own box, so the rows
     refit. Its look is the design sitting's; the height is one number. */
  #strip { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: var(--strip, 0px); display: none; }
  body.leader { --strip: 44px; }
  body.leader #strip { display: flex; }
  body.leader #corner { top: calc(env(safe-area-inset-top, 0px) + var(--strip) + 6px); }   /* below the band, not over its right end */
  /* 9i: THE DISPLAY (AR-32) — the full score on a big screen, big letter + time,
     following the room; a small way back to the remote */
  body.display #corner { font-size: 34px; padding: 10px 16px; gap: 12px; border-radius: 14px; }
  body.display #dot { width: 14px; height: 14px; }
  #toRemote { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 10px; display: none; font: 13px system-ui, sans-serif; color: #666; background: #fffc; padding: 5px 9px; border-radius: 10px; text-decoration: none; }
  body.display #toRemote { display: block; }
  /* a page = several systems (rows) of this part, each its own SVG the size of
     the frame, stacked — a paper part's shape */
  #sheet > svg { position: absolute; left: 0; top: 0; display: block; }
  #animov { position: absolute; top: 0; left: 0; pointer-events: none; }
  /* the one-time hint (the strip comes in 9i) */
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #000b; color: #eee;
          font: 15px sans-serif; padding: 8px 14px; border-radius: 16px; opacity: 0; transition: opacity .5s; pointer-events: none; white-space: nowrap; }
  #hint.on { opacity: 1; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #b00; background: #fff8; font: 12px monospace; white-space: pre-wrap; max-width: 90vw; }
  #err:empty { display: none; }
  /* 9h-2: the corner (AR-18 — the rehearsal letter and the time) and the dot
     (AR-14 — readiness colour only, for now). Shown only when the page was
     opened by a link. The look is the design sitting's (9i). */
  #corner { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); right: 10px; display: none; align-items: center; gap: 7px;
            font: 13px/1 system-ui, sans-serif; color: #666; background: #fffc; padding: 5px 9px; border-radius: 10px; pointer-events: none; }
  body.room #corner { display: flex; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #999; }
  #dot.amber { background: #e9a825; } #dot.green { background: #2ecc71; }
  #door { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #fff; color: #222;
          font: 20px/1.4 system-ui, sans-serif; padding: 2em; text-align: center; }
  #door.on { display: flex; }
</style>
</head>
<body>
<div id="strip"></div>
<div id="sheet"></div>
<div id="hint"></div>
<div id="err"></div>
<div id="corner"><span id="dot"></span><span id="ctext"></span></div>
<a id="toRemote" href="#">remote</a>
<div id="door"></div>
<script src="/notation/lib/coords.js"></script>
<script src="/notation/lib/stamps.js"></script>
<script src="/notation/lib/layout.js"></script>
<script src="/notation/lib/gc.js"></script>
<script src="/notation/lib/render.js"></script>
<script src="/notation/lib/splice.js"></script>
<script src="/notation/lib/transport.js"></script>
<script src="/notation/lib/animobj.js"></script>
<script src="/notation/lib/animlive.js"></script>
<script src="/notation/lib/roomclient.js"></script>
<script src="/notation/lib/strip.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  // 9h-2: THE PAGE OPENED BY A TOKEN — /s/<token> (the door) carries the part,
  // the piece and the room; ?part= stays for the workshop and the checks.
  const TOKEN = (location.pathname.match(/^\/s\/([A-Za-z0-9_-]{8,64})$/) || [])[1] || Q.get('token') || null;
  // ?part=N (1…10) picks the part — the token of 9g will carry this later.
  // THE SIZE KNOBS (AR-20: "the part's size / the screen's time span: chosen by
  // eye on the real iPad" — 9i's sitting; here as link parameters so the
  // composer can try sizes without a build): ?s= seconds per system (row) ·
  // ?rows= systems per page · ?z= an extra factor on the staff. Also ?ir= the
  // score file · ?t= go to a time · ?play=1 start playing (the check's hooks).
  let PART = Math.min(7, Math.max(1, parseInt(Q.get('part') || '1', 10) || 1));   // the septet: 7 parts; a token sets it
  let IR = Q.get('ir') || 'piece-septet';   // the septet's score; a token sets it
  // 9i: THE DISPLAY (AR-32) — the gatekeeper's link with ?view=display: the full
  // score on a big screen, following the room, stopped or playing; a tap on a
  // part (or the remote's display.show) zooms that part, again → back. Only the
  // gatekeeper's link is a display; a player's link is always their part.
  let DISPLAY = Q.get('view') === 'display';
  // THE DECISION (PLAN 9s, day 46, the composer's eye after the data: "8 seconds,
  // 5 rows, 7.5 mm reads best"): rows of 8 s at a 7.5 mm staff, five to a screen.
  // On the iPad that is 140 px/s = 2.7 cm/s — inside the 2–3 cm/s reading
  // ceiling (Vickery 2014) and above the piece's cluster floor (7.3 s).
  const S_DEFAULT = 8, ROWS_DEFAULT = 5;
  const SS_DEFAULT = 9.75;   // a 7.5 mm staff on the iPad class (AR-20, day 46)
  // THE DRAWING LANE (day 46, the composer on rows per screen and the GCs' feel):
  // the GC's drop and the meters span the LANE's height (gc.js), so a taller
  // row made taller arcs — "it felt awkward, so I shrank the GCs". The lane the
  // drawing sees is now its own height in staff spaces, centred in the row; the
  // row count only adds air around it. Default: the jury frame's lane, which the
  // composer approved — 104 px at a 31.6 px staff = 13.2 ss. ?lane= overrides.
  const LANE_DEFAULT = 13.2;
  const LANE_SS = Math.max(6, parseFloat(Q.get('lane')) || LANE_DEFAULT);
  let ROWS = Math.min(12, Math.max(1, parseInt(Q.get('rows') || String(ROWS_DEFAULT), 10) || ROWS_DEFAULT));   // the display sets 1 after its welcome (9i)
  const Z_EXTRA = Math.max(0.25, parseFloat(Q.get('z')) || 1);
  // THE CIRCULAR BUFFER (D101, day 46 — the composer: "b"; the string quartet's
  // parts mode, built there and checked): the screen's ROWS slots are a ring over
  // the planned rows — planned row i always lives in slot i mod ROWS, so the
  // screen shows rows cur … cur + ROWS − 1; when the cursor leaves row cur, its
  // slot reloads with row cur + ROWS; the cursor runs down the slots and wraps to
  // the top. At least ROWS − 1 rows of future music are visible at every moment.
  const state = { scores: {}, cur: 0, live: null, slots: null, layers: null, geomKey: '', turnLog: [],
    room: null, mode: 'ALONE', tuple: null, following: false, lastSeq: null, letters: [],
    parts: null, zoom: null, strip: null, leader: false, role: null, rowId: null };   // 9i: the parts drawn (the display), the strip, who I am
  const partsDrawn = () => state.parts || [PART - 1];
  // [port 9t] THE PIECE'S INSTRUMENTS — notation/registry/ensemble.json (clefs,
  // staves, short names, lane weights) and techniques.json, as the piece's own
  // notation page reads them. Absent = one bass staff per part, 'T<n>' labels.
  const ensPart = p => (state.ensemble && state.ensemble.parts.find(q => q.part === p)) || null;
  const stavesOf = p => { const e = ensPart(p); return (e && e.staves && e.staves.length) || 1; };
  const weightOf = p => { const e = ensPart(p); return (e && e.weight) || 1; };
  function grandStaffOpts() { const g = (((state.container || {}).engraving || {}).layout || {}).grandStaff; return g && g.interStaffGapSs > 0 ? { interStaffGapSs: g.interStaffGapSs } : undefined; }
  state.local = NotationTransport.makeTransport();   // 9h-2: the local transport; the room's tuple is the other reader
  state.transport = state.local;
  let rafId = null;

  async function loadScore(name) {
    if (state.scores[name]) return state.scores[name];
    const r = await fetch('/api/composer/load/' + name);
    if (!r.ok) throw new Error('score fetch ' + name + ' ' + r.status);
    const j = await r.json();
    state.scores[name] = j.data || j;
    return state.scores[name];
  }

  // THE FRAME is the screen, in CSS px, inside the safe areas: the sheet's own
  // laid-out box — measured, never computed from innerHeight or the insets,
  // which on the home-screen app each left the last row short (iPad, day 46).
  function frameSize() {
    const r = $('sheet').getBoundingClientRect();
    const W = Math.max(320, Math.floor(r.width));
    const H = Math.max(240, Math.floor(r.height));
    return { W, H };
  }
  // the home-screen app settles its viewport after the first paint: re-measure
  // a little later and on every viewport change; re-render only on a change
  function sizeChanged() {
    if (!state.size) return false;
    const { W, H } = frameSize();
    return W !== state.size.W || H !== state.size.H;
  }
  function refit() { if (state.ir && sizeChanged()) render(); }
  const pageSeconds = () => Math.max(2, parseFloat(Q.get('s')) || S_DEFAULT);
  // the planned row (one system's worth, s seconds, cut by the page rules) that holds t
  function plannedOf(t) {
    const P = state.planned;
    let i = P.findIndex(pg => t >= pg.t0 - 1e-9 && t < pg.t1);
    if (i < 0) i = t >= P[P.length - 1].t1 - 1e-9 ? P.length - 1 : 0;
    return i;
  }
  const slotOf = i => i % ROWS;
  const srcEnd = () => state.ir.source.window[1];

  // THE GEOMETRY of a row, computed once per frame size: the staff from the
  // size dial, the speed from the seconds dial, the drawing lane centred in the
  // row. THE SIZE keeps the jury frame's reference: the staff space is the dial
  // (default 7.5 mm), the gutter and the lane scale with it.
  function geometry() {
    const C = state.container;
    const { W, H } = frameSize();
    const s = pageSeconds();
    const juryW = (C.frame && C.frame.widthPx) || 1920;
    const regSeconds = (C.timeScale && C.timeScale.defaults && C.timeScale.defaults.trance) || 12;
    const G0 = (C.prefatory && C.prefatory.gutterPx) || 0;
    const ssJury = ((C.staff && C.staff.staffHeightPx) || 31.6) / 4;
    const juryPxPerS = (juryW - G0) / regSeconds;
    // THE TWO DIALS (day 46, the composer: "2 dials"): ?ss= the staff space in CSS
    // px — THE NOTE SIZE, fixed from printed parts (a 7.5 mm staff; on the iPad
    // class 5.2 CSS px/mm → ss 9.75) · ?s= seconds per row — THE SPEED. ?ss=auto
    // keeps the first build's coupling (the staff scaling with the speed), for
    // comparison only.
    const ssArg = Q.get('ss');
    let ss, pxPerS, k;
    // 9i: the parts in the band — one (the part) or all of them (the display's
    // full score): the ensemble's weighted lanes, a gap between them
    const parts = partsDrawn(), wts = parts.map(weightOf), wsum = wts.reduce((a, b) => a + b, 0);
    const rowH = H / ROWS, padFrac = 0.03, gapFrac = parts.length > 1 ? 0.012 : 0;
    const gapsFrac = gapFrac * (parts.length - 1);
    if (ssArg === 'auto') {
      pxPerS = W / (s + G0 / juryPxPerS);
      k = (pxPerS / juryPxPerS) * Z_EXTRA;
      ss = ssJury * k;
    } else {
      ss = (parseFloat(ssArg) || SS_DEFAULT) * Z_EXTRA;
      // the full score: the staff shrinks until every lane fits the row (one size for all)
      if (parts.length > 1) ss = Math.min(ss, rowH * (1 - 2 * padFrac) * (1 - gapsFrac) / (wsum * LANE_SS));
      k = ss / ssJury;
      pxPerS = (W - Math.min(W * 0.4, G0 * k)) / s;
    }
    const gutterPx = Math.min(W * 0.4, G0 * k);
    const laneH = Math.min(rowH * (1 - 2 * padFrac), LANE_SS * ss * wsum / (1 - gapsFrac));   // [port 9t] the ensemble's lane weight; 9i: every drawn part's lane in the band
    const laneAir = (rowH - laneH) / 2;
    return { W, H, s, ss, k, pxPerS, gutterPx, rowH, laneH, laneAir, ssPerSystem: laneH / ss, parts, wts, gapFrac, coupling: ssArg === 'auto' ? 'auto' : 'fixed' };
  }

  // ONE ROW in one slot: a full-frame SVG with the system in the slot's lane, and
  // its scene for the overlay. A ROW ENDS WHERE ITS MUSIC ENDS (the composer: "the
  // cursors don't go all the way to the end"): the page rules cut one row in five
  // short to keep a figure whole on the next row; the row's view is only as wide
  // as its own music at the constant px per second — a ragged right edge, the end
  // bar at the cut, the cursor running to it.
  function buildSlot(k, i) {
    const C = state.container, G = state.geom, pg = state.planned[i];
    const f0 = (k * G.rowH + G.laneAir) / G.H, f1 = (k * G.rowH + G.laneAir + G.laneH) / G.H;
    const rowSeconds = Math.min(G.s, pg.t1 - pg.t0);
    const rowW = Math.min(G.W, G.gutterPx + rowSeconds * G.pxPerS);
    // the lanes in the band [f0, f1]: one part = the whole band; the full score (the
    // display, 9i) = the ensemble's weighted lanes inside it, the staff one size
    let sysList;
    if (G.parts.length === 1) sysList = [{ part: G.parts[0], laneFrac0: f0, laneFrac1: f1, ssPerSystem: G.ssPerSystem }];
    else {
      const band = f1 - f0;
      sysList = NotationCoords.systemsForParts(G.parts, { topPad: 0, botPad: 0, gap: G.gapFrac, weights: G.wts }).map(sy => {
        const a = f0 + sy.laneFrac0 * band, b = f0 + sy.laneFrac1 * band;
        return { part: sy.part, laneFrac0: a, laneFrac1: b, ssPerSystem: (b - a) * G.H / G.ss };
      });
    }
    const view = NotationCoords.makeView({ widthPx: rowW, heightPx: G.H, window: [pg.t0, pg.t0 + rowSeconds], gutterPx: G.gutterPx,
      systems: NotationCoords.withStaves(sysList, stavesOf, grandStaffOpts()),   // [port 9t] the part's own staves and clefs
      ssPerSystem: G.ssPerSystem });
    const ownsEnd = i === state.planned.length - 1;
    let svg = NotationRender.renderSection(state.model, view, state.glyphs, {
      reshow: pg.reshow, ownsEnd, engraving: (C.engraving && C.engraving.render) || {},
      hideBricks: true,   // the parachute bricks are a workshop look, not the part's (composer, day 46)
      flushCurves: true,  // [port 9t] the section curves meet the row's edges (the stand only; the print score and the film keep their own cut)
      ensemble: state.ensemble,   // [port 9t] the part's short name as its label
    });
    // the rows stack: the paper is the sheet's, not each SVG's (render.js paints
    // a full-frame paper rect first — the row above would vanish)
    svg = svg.replace(/ style="background:[^"]*"/, '')
             .replace(/<rect x="0" y="0" width="[\d.]+" height="[\d.]+" fill="[^"]*"\/>/, '');
    // the system's terminal barline, as the full score draws it
    const eb = ((C.engraving && C.engraving.render) || {}).systemEndBar;
    let endBar = '';
    if (eb) {
      const sys = view.systems[0], se = srcEnd();
      const xEnd = (se > view.window[0] && se < view.window[1]) ? view.xOfSeconds(se) : view.widthPx;
      endBar = '<rect x="' + (xEnd - eb.wPx).toFixed(2) + '" y="' + sys.yTopPx.toFixed(1) +
        '" width="' + eb.wPx + '" height="' + (sys.yBotPx - sys.yTopPx).toFixed(1) + '" fill="#111" opacity="' + (eb.opacity || 0.55) + '"/>';
    }
    const tpl = document.createElement('template');
    tpl.innerHTML = svg.replace('</svg>', endBar + '</svg>');
    const el = tpl.content.firstElementChild;
    const old = state.slots[k];
    if (old && old.el.parentNode) old.el.parentNode.replaceChild(el, old.el);
    else $('sheet').appendChild(el);
    state.slots[k] = { k, idx: i, pg, view, el };
    // each row shows its overlay only while t is inside ITS music — from its
    // start to the page rules' cut, where the next row begins
    state.layers[k] = { scene: NotationAnimLive.plan(state.animInstances, view, state.animStyle), opacity: 1,
      clip: [pg.t0, Math.min(pg.t1, srcEnd() + 1)] };
  }
  function clearSlot(k) {
    const old = state.slots[k];
    if (old && old.el.parentNode) old.el.parentNode.removeChild(old.el);
    state.slots[k] = null; state.layers[k] = null;
  }

  // (re)lay the ring out for state.cur: only the slots whose row changed are
  // rebuilt — one slot at a row change, every slot at a goto or a frame change
  function render() {
    try {
      const s = pageSeconds();
      if (!state.planned || state.plannedS !== s) {
        state.planned = NotationSplice.planPages(state.ir, state.pageRules, s);
        state.plannedS = s;
      }
      state.cur = Math.min(Math.max(0, state.cur), state.planned.length - 1);
      const G = geometry();
      const key = [G.W, G.H, G.s, G.ss, ROWS, LANE_SS, G.parts.join(',')].join('|');
      if (key !== state.geomKey || !state.slots) {
        $('sheet').innerHTML = '';
        if (state.live) { state.live.destroy(); state.live = null; }
        state.slots = new Array(ROWS).fill(null); state.layers = new Array(ROWS).fill(null);
        state.geomKey = key;
      }
      state.geom = G;
      // the instances: the whole piece once, then THIS part's (and the score-level ones)
      if (!state.animInstances || state.animParts !== G.parts.join(',')) {
        const C = state.container;
        const score = state.scores[state.ir.source.score] || null;
        const _dev = NotationLayout.deviceResolver(state.ir, (C.engraving || {}).layout || {});
        const all = NotationAnimObj.collect(state.ir, score, C.animated,
          { parts: state.ir.source.parts, meta: false, deviceOf: _dev,
            drawnOf: e => NotationLayout.drawnLevelSamples(e, _dev(e) || {}) });
        const drawn = new Set(G.parts);
        state.animInstances = all.filter(i => i.part === undefined || drawn.has(i.part));
        state.animParts = G.parts.join(','); state.animStyle = C.animated;
      }
      const n = state.planned.length;
      for (let i = state.cur; i < state.cur + ROWS; i++) {
        const k = slotOf(i);
        if (i >= n) { clearSlot(k); continue; }
        if (state.slots[k] && state.slots[k].idx === i) continue;
        buildSlot(k, i);
      }
      const last = Math.min(n - 1, state.cur + ROWS - 1);
      state.size = { W: G.W, H: G.H, rows: last - state.cur + 1, rowsMax: ROWS, s: G.s, ss: +G.ss.toFixed(2), staffMmIpad: +(G.ss * 4 / 5.2).toFixed(2),
        pxPerS: +G.pxPerS.toFixed(1), laneSs: +G.ssPerSystem.toFixed(1), laneWanted: LANE_SS, rowPx: +G.rowH.toFixed(1), k: +G.k.toFixed(3), coupling: G.coupling, parts: G.parts.slice(),
        page: [state.planned[state.cur].t0, state.planned[last].t1] };
      mountLive();
      $('err').textContent = '';
    } catch (e) { $('err').textContent = String(e.stack || e); }
  }
  // A2 (9a): one overlay per frame size, kept across rows; a reload re-plans
  // one slot's scene. One scene per slot — a slot not holding t has its rider
  // off the frame, and its layer clipped to its own music.
  function mountLive() {
    const G = state.geom;
    if (!state.live) state.live = NotationAnimLive.mount($('sheet'), { widthPx: G.W, heightPx: G.H }, { snap: Q.get('snap') !== '0' });
    state.live.attach($('sheet'));   // the overlay stays the sheet's last child, above every row
    state.live.setLayers(state.layers);
    state.live.setScale(1);
  }

  // ---- the clock on the page ------------------------------------------------
  const rowEnd = () => Math.min(state.planned[state.cur].t1, srcEnd());
  function drawOverlayFrame(tArg) {
    if (!state.slots) return null;
    // the pre-roll (AR-33): a jump lands ~5 s before the spot and the top gets the
    // same — the transport may read NEGATIVE time; the drawing waits at the start
    const t = Math.max(0, tArg !== undefined ? tArg : state.transport.now());
    if (state.transport.isPlaying() && t >= rowEnd() - 1e-9) {
      // the row change: the cursor leaves row cur — its slot reloads with row
      // cur + ROWS (one slot built), the cursor goes on in the next slot
      const c0 = performance.now();
      if (state.cur < state.planned.length - 1) { state.cur++; render(); }
      else state.transport.pause();
      state.turnLog.push({ t, ms: performance.now() - c0 });
      if (state.turnLog.length > 200) state.turnLog.shift();
      return { turned: true, t };
    }
    state.live.frame(t);
    return { turned: false, t };
  }
  // each frame is drawn at the FRAME's time (the rAF timestamp), not at the
  // callback's — a game loop's rule
  function animLoop(ts) {
    rafId = null;
    drawOverlayFrame(typeof ts === 'number' ? state.transport.nowAt(ts) : undefined);
    if (state.transport.isPlaying()) rafId = requestAnimationFrame(animLoop);
  }
  function ensureLoop() { if (!rafId) rafId = requestAnimationFrame(animLoop); }
  function goto(t) {
    const i = plannedOf(t);
    if (i !== state.cur) { state.cur = i; render(); }
    state.transport.seek(t); ensureLoop();
  }
  let wakeLock = null;
  // AR-25: the screen stays awake while the part plays (needs HTTPS; silent otherwise)
  async function keepAwake() { try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; } }
  function letSleep() { if (wakeLock) { try { wakeLock.release(); } catch (e) { } wakeLock = null; } }
  async function play() {
    if (!state.slots || state.following) return;
    const t = state.transport.now(), t0 = state.planned[state.cur].t0;
    if (t < t0 || t >= rowEnd()) state.transport.seek(t0);
    state.transport.play(); ensureLoop();
    keepAwake();
  }
  function pause() { if (state.following) return; state.transport.pause(); ensureLoop(); letSleep(); }
  function togglePlay() {
    if (DISPLAY) return;   // the display has no local play (AR-32)
    if (state.following) { hint('the room is playing', 1500); return; }   // AR-11: nothing while the room plays
    if (state.transport.isPlaying()) pause(); else play();                  // AR-12: local play while the room is stopped
  }
  // a swipe = a screenful of rows (AR-26's "page")
  function turnPage(d) {
    if (!state.planned || state.following || DISPLAY) return;   // snapped while the room plays; the display only follows
    const i = Math.min(state.planned.length - 1, Math.max(0, state.cur + d * ROWS));
    if (i === state.cur) return;
    state.cur = i; render();
    state.transport.seek(state.planned[i].t0); ensureLoop();
  }
  // one-finger tap = place the cursor (AR-26): the slot under the finger, the
  // time under it, inside that row's music
  // 9i: on the display a one-finger tap on a part ZOOMS it (AR-32: tap a part → zoom,
  // again → back); display-local. The lane nearest the finger, in the slot under it.
  function partAt(clientX, clientY) {
    if (!state.slots) return null;
    const rect = $('sheet').getBoundingClientRect();
    const k = Math.min(ROWS - 1, Math.max(0, Math.floor((clientY - rect.top) / rect.height * ROWS)));
    const slot = state.slots[k]; if (!slot) return null;
    // the laid-out systems carry their lane in frame px (yTopPx · yBotPx), and the
    // row's SVG is the frame, so the finger's y in the sheet is the frame's y
    const y = (clientY - rect.top) * (state.geom.H / rect.height);
    let best = null;
    for (const sy of slot.view.systems) {
      if (typeof sy.part !== 'number') continue;
      const d = y < sy.yTopPx ? sy.yTopPx - y : y > sy.yBotPx ? y - sy.yBotPx : 0;
      if (!best || d < best.d) best = { d, part: sy.part };
    }
    return best ? best.part : null;
  }
  function setZoom(p) {
    if (!DISPLAY || !state.ir) return;
    state.zoom = p == null ? null : Number(p);
    state.parts = state.zoom == null ? state.ir.source.parts.slice() : [state.zoom];
    render(); ensureLoop();
  }
  function seekAt(clientX, clientY) {
    if (DISPLAY) { const p = partAt(clientX, clientY); if (p != null) setZoom(state.zoom == null ? p : null); return; }
    if (!state.slots || state.following) return;
    const rect = $('sheet').getBoundingClientRect();
    const k = Math.min(ROWS - 1, Math.max(0, Math.floor((clientY - rect.top) / rect.height * ROWS)));
    const slot = state.slots[k]; if (!slot) return;
    const view = slot.view;
    const t = view.secondsOfX((clientX - rect.left) * (view.widthPx / rect.width) * (rect.width / state.geom.W));
    const [w0, w1] = view.window;
    if (t >= w0 && t <= w1) goto(t);
  }

  // ---- THE GESTURES (AR-26, one vocabulary): swipe = pages · one-finger tap =
  // cursor · two-finger tap = play / stop. Laptop (AR-28): click = cursor ·
  // space = play / stop · arrows = pages.
  let touch = null;
  const sheet = $('sheet');
  sheet.addEventListener('touchstart', e => {
    e.preventDefault();
    const f = e.touches[0];
    if (!touch) touch = { t: performance.now(), n: 0, x: f.clientX, y: f.clientY, dx: 0, dy: 0, moved: false };
    touch.n = Math.max(touch.n, e.touches.length);
  }, { passive: false });
  sheet.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touch) return;
    const f = e.touches[0];
    touch.dx = f.clientX - touch.x; touch.dy = f.clientY - touch.y;
    if (Math.hypot(touch.dx, touch.dy) > 12) touch.moved = true;
  }, { passive: false });
  sheet.addEventListener('touchend', e => {
    e.preventDefault();
    if (!touch || e.touches.length) return;
    const dt = performance.now() - touch.t;
    if (touch.moved) {
      if (Math.abs(touch.dx) > 60 && Math.abs(touch.dx) > 2 * Math.abs(touch.dy)) turnPage(touch.dx < 0 ? 1 : -1);
    } else if (dt < 500) {
      if (touch.n >= 2) togglePlay(); else seekAt(touch.x, touch.y);
    }
    touch = null;
  }, { passive: false });
  sheet.addEventListener('touchcancel', () => { touch = null; });
  sheet.addEventListener('click', e => { if (!('ontouchstart' in window) || e.detail === 0) seekAt(e.clientX, e.clientY); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') turnPage(1);
    else if (e.key === 'ArrowLeft') turnPage(-1);
  });
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', () => setTimeout(refit, 300));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

  // ---- THE ROOM (9h-2; DESIGN §5–§6) --------------------------------------------
  // The tuple is read as a transport while the room plays (the floor clock
  // converts server time); while the room is stopped the local transport is back,
  // snapped to the room's position; under ALONE the room is only listened to.
  function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('script ' + src)); document.head.appendChild(el); }); }
  function door(msg) { const d = $('door'); d.textContent = msg; d.classList.add('on'); }
  function applyWelcome(w) {
    if (w.partIndex != null) PART = w.partIndex + 1;
    if (w.piece && w.piece.ir) IR = w.piece.ir;
    state.mode = w.mode || 'ALONE'; state.tuple = w.roomState || null; state.letters = w.letters || [];
    state.role = w.role || null; state.rowId = w.rowId || null; state.leader = !!w.leader;
    if (w.role !== 'gatekeeper') DISPLAY = false;   // only the gatekeeper's link is a display
    if (DISPLAY) { document.body.classList.add('display'); if (!Q.get('rows')) ROWS = 1; $('toRemote').href = '/s/' + TOKEN; state.zoom = w.displayPart == null ? null : Number(w.displayPart); }   // the zoom as last chosen from the remote
    const title = ((w.piece && w.piece.title) || 'Part') + ' · ' + (DISPLAY ? 'display' : (w.part || ('part ' + PART)));
    document.title = title;
    const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.content = title;
  }
  // the page opened by a token: hello first (4 s), else the cached welcome (offline)
  async function startRoom() {
    document.body.classList.add('room');
    await Promise.all([loadScript('/socket.io/socket.io.js'), loadScript('/testkit/js/syncclock.js')]);
    state.room = NotationRoom.makeRoomClient({
      token: TOKEN, io: window.io, SyncClock: TK.SyncClock, posture: 'rehearsal',
      on: {
        state: t => { state.tuple = t; applyRoom(); },
        mode: m => { state.mode = m.mode; if (m.roomState) state.tuple = m.roomState; applyRoom(); hint(m.mode === 'ALONE' ? 'alone' : m.mode.toLowerCase(), 1500); },
        status: roomCorner,
        refused: r => door((r && r.message) || 'this link was refused'),
        // 9i: the leader tick is live (DESIGN §8): the roster says who holds the strip
        roster: r => { const me = state.rowId && r && r.members && r.members.find(m => m.rowId === state.rowId); if (me && typeof me.leader === 'boolean' && me.leader !== state.leader) { state.leader = me.leader; if (state.slots) { if (state.leader) mountStrip(); else unmountStrip(); } } },
        // 9i: the remote's zoom for the display (AR-32)
        display: d => { if (DISPLAY) setZoom(d && d.partIndex != null ? d.partIndex : null); },
      },
    });
    const first = new Promise(res => {
      let done = false;
      const fin = x => { if (!done) { done = true; res(x); } };
      state.room.connect();
      state.room.socket.once('welcome', w => fin({ welcome: w }));
      state.room.socket.on('refused', r => { if (r && (r.what === 'hello' || r.what === 'token')) fin({ refused: r }); });
      setTimeout(() => fin({ timeout: true }), 4000);
    });
    const r = await first;
    if (r.refused) { door(r.refused.message || 'this link was refused'); throw new Error('refused: ' + (r.refused.error || '')); }
    if (r.welcome) { applyWelcome(r.welcome); return; }
    const c = state.room.cachedWelcome();
    if (c) { applyWelcome(Object.assign({ mode: 'ALONE' }, c, { roomState: null })); hint('no connection — alone, from the last visit', 4000); return; }
    door('No connection, and this stand has not opened this link before. Connect once, then it works alone too.');
    throw new Error('offline and no cached welcome');
  }
  function applyRoom() {
    if (!state.room || !state.slots) return;
    const t = state.tuple, follow = state.mode !== 'ALONE' && !!(t && t.playing);
    if (follow) {
      if (!state.following) { state.local.pause(); state.following = true; state.transport = state.room.transport; }
      const i = plannedOf(Math.max(0, state.transport.now()));
      if (i !== state.cur) { state.cur = i; render(); }
      ensureLoop(); keepAwake();
    } else {
      const was = state.following;
      if (was) { state.following = false; state.transport = state.local; letSleep(); }
      // snap: the room stopped, or jumped while stopped (a new tuple) — AR-11
      if (state.mode !== 'ALONE' && t && (was || state.lastSeq !== t.seq)) { state.local.pause(); goto(t.anchorScoreTime); }
    }
    state.lastSeq = t ? t.seq : null;
    roomCorner();
  }
  const fmtT = t => { const v = t || 0, x = Math.abs(v), m = Math.floor(x / 60); return (v < 0 ? '−' : '') + m + ':' + (x - m * 60).toFixed(1).padStart(4, '0'); };   // a negative time = the pre-roll's countdown
  // the letter we are in — or the one the pre-roll is heading to: a jump lands 5 s
  // before its letter, and the corner should say that letter, not the one before
  function letterAt(t) { let l = null; for (const x of state.letters) if (x.t <= t + 5 + 1e-9) l = x; return l; }
  // ---- THE STRIP (9i, AR-30): the leader's own part gets the band above it ----------
  // Under ALONE the strip's play is this stand's own (DESIGN §6); under REHEARSAL
  // it moves the room. Mounted when the welcome or the roster says "leader".
  function mountStrip() {
    if (state.strip || !state.room || DISPLAY) return;
    document.body.classList.add('leader');
    state.strip = NotationStrip.make($('strip'), {
      room: state.room, layout: 'strip', letters: () => state.letters,
      local: { play: () => play(), stop: () => pause(), isPlaying: () => !state.following && state.local.isPlaying(), now: () => state.transport.now(), goto: t => goto(t) },
    });
    refit();
  }
  function unmountStrip() {
    if (!state.strip) return;
    state.strip.destroy(); state.strip = null;
    document.body.classList.remove('leader');
    refit();
  }
  function roomCorner() {
    if (!state.room) return;
    const s = state.room.status();
    const pos = state.transport.now();
    const L = letterAt(pos);
    $('ctext').textContent = (s.online ? state.mode.toLowerCase() : 'offline') + (state.following ? ' ▶' : '') + ' · ' + (L ? L.label + ' · ' : '') + fmtT(pos);
    $('dot').className = !s.online ? '' : s.calibrated ? 'green' : 'amber';
  }
  setInterval(() => { if (state.room && state.slots) roomCorner(); }, 500);

  // the one-time hint: how to play (the strip and the menu come in 9i)
  function hint(text, ms) {
    const h = $('hint'); h.textContent = text; h.classList.add('on');
    clearTimeout(hint.tm); hint.tm = setTimeout(() => h.classList.remove('on'), ms || 4000);
  }

  // headless check + the composer's link: ?t= and ?play=1, and the state
  window.__standGoto = t => { goto(t); return { cur: state.cur, page: state.size && state.size.page }; };
  window.__standRows = () => (state.slots || []).map((sl, k) => sl ? { slot: k, idx: sl.idx, t0: sl.pg.t0, t1: sl.pg.t1, window: sl.view.window, gutterPx: sl.view.gutterPx } : null);
  window.__standPlay = () => { play(); return true; };
  window.__standPause = () => { pause(); return true; };
  window.__standPlayLocal = () => { togglePlay(); return state.local.isPlaying(); };
  window.__stripAct = (name, arg) => state.strip ? (state.strip.act(name, arg), true) : false;   // 9i: the check drives the strip's buttons
  window.__standZoom = p => { setZoom(p); return partsDrawn(); };
  window.__standState = () => ({
    part: PART, ir: IR, ready: !!state.slots, error: $('err').textContent,
    token: !!TOKEN, mode: state.mode, following: state.following, room: state.room ? state.room.status() : null, corner: $('ctext').textContent,
    strip: !!state.strip, leader: state.leader, role: state.role, display: DISPLAY, parts: partsDrawn(), zoom: state.zoom,
    lanes: DISPLAY && state.slots && state.slots[0] ? state.slots[0].view.systems.filter(s => typeof s.part === 'number').map(s => ({ part: s.part, y0: s.yTopPx, y1: s.yBotPx })) : null,
    sheetTop: $('sheet').getBoundingClientRect().top,
    stripText: state.strip ? { play: state.strip.host.querySelector('.ns-play').textContent, again: state.strip.host.querySelector('.ns-again').textContent, pos: state.strip.host.querySelector('.ns-pos').textContent, ready: state.strip.host.querySelector('.ns-ready').textContent, playing: state.strip.host.classList.contains('playing'), sheetTop: $('sheet').getBoundingClientRect().top } : null,
    t: state.transport.now(), playing: state.transport.isPlaying(),
    cur: state.cur, rowsTotal: state.planned ? state.planned.length : 0,
    pageIdx: Math.floor(state.cur / ROWS), pages: state.planned ? Math.ceil(state.planned.length / ROWS) : 0,
    ring: (state.slots || []).map(sl => sl ? sl.idx : null),
    size: state.size || null, turns: state.turnLog.slice(),
    pieces: state.layers ? state.layers.reduce((a, L) => a + (L ? L.scene.pieces.length : 0), 0) : null,
    instances: state.animInstances ? state.animInstances.length : null,
    overlay: state.live ? state.live.stats() : null,
    standalone: !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)),
  });

  try {
    if (TOKEN) await startRoom();
    const [glyphs, pageRules, container, irRes, ensemble, techniques] = await Promise.all([
      fetch('/notation/lib/glyphs.json').then(r => { if (!r.ok) throw new Error('glyphs fetch ' + r.status); return r.json(); }),
      fetch('/notation/registry/page_rules.json').then(r => { if (!r.ok) throw new Error('page rules fetch ' + r.status); return r.json(); }),
      fetch('/notation/registry/container.json').then(r => { if (!r.ok) throw new Error('container fetch ' + r.status); return r.json(); }),
      fetch('/notation/ir/' + IR + '.ir.json').then(r => { if (!r.ok) throw new Error('IR fetch ' + IR + ' ' + r.status); return r.json(); }),
      // [port 9t] the piece's registries — optional: absent = one bass staff per part
      fetch('/notation/registry/ensemble.json').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/notation/registry/techniques.json').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    state.glyphs = glyphs; state.pageRules = pageRules; state.container = container; state.ir = irRes;
    state.ensemble = ensemble; state.techniques = techniques;
    try { await loadScore(state.ir.source.score); } catch (e) { /* the score-level objects are optional */ }
    state.model = NotationLayout.layoutSection(state.ir, state.glyphs, Object.assign(
      { frameParts: state.ir.source.parts, ensemble: state.ensemble, techniques: state.techniques },   // [port 9t]
      (container.engraving && container.engraving.layout) || {}));
    if (DISPLAY) state.parts = state.zoom == null ? state.ir.source.parts.slice() : [state.zoom];   // the full score, or the part the remote chose (9i)
    render();
    setTimeout(refit, 300); setTimeout(refit, 1200);
    if (state.leader && state.role === 'player' && TOKEN) mountStrip();   // 9i: the ticked leader's band
    if (Q.has('t') && isFinite(parseFloat(Q.get('t')))) goto(parseFloat(Q.get('t')));
    else ensureLoop();
    if (state.room) { state.lastSeq = state.tuple ? state.tuple.seq : null; if (state.tuple && state.mode !== 'ALONE') { if (state.tuple.playing) applyRoom(); else goto(state.tuple.anchorScoreTime); } roomCorner(); }
    if (Q.get('play') === '1') play();
    else if (DISPLAY) hint('tap a part to zoom it · tap again for the whole score', 5000);
    else hint('two fingers: play / stop · one finger: cursor · swipe: page', 5000);
  } catch (e) { $('err').textContent = String(e.stack || e); }
})();
</script>
</body>
</html>
